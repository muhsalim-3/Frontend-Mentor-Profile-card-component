<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>Frontend Mentor | Profile card component</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
        
      img{
        max-width: 100%;
        width: 100%;
      }
      
      .bg-top{
        position: absolute;
        right: 50%;
        bottom: 50%;
        z-index: -1; 
      }

      .bg-bottom{
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: -1;
      }

      body {
        background-color: #2d3248;
        font-family: sans-serif;
        background-color: #19a2ae;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 1440px;
      }

      .card {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        width: 300px;
        text-align: center;
      }

      .card-header {
        position: relative;
      }

      .profile-picture {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 3px solid white;
        position: absolute;
        bottom: -42px;
        left: 36%;
      }

      .card-body {
        margin-top: 40px;
        padding: 20px;
      }

      .card-body h1 {
        color: #2d3248;
        font-family: sans-serif;
        font-size: 22px;
        font-weight: bold;
      }

      .card-body h1 span {
        font-weight: lighter;
        color: #a8a7a7;
        font-size: 18px;
        padding-left: 3px;
      }

      .card-body p {
        margin-top: 10px;
        color: #a8a7a7;
        font-size: 14px;
      }

      .card-footer {
        border-top: 1px solid #e2e0e0;
        padding: 33px;
      }

      .card-footer ul{
        display: flex;
        font-size: 18px;
        font-weight: bold;
        text-align: center;
        list-style-type: none;
        justify-content: space-between;
        color: #2d3248; 
      }

      .card-footer span{
        display: block;
        text-align: center;
        color: #a8a7a7;
        font-size: 11px;
        justify-content: space-between;
        margin-top: 6px;
        letter-spacing: 1px;
      }

      .attribution { 
          position: absolute;
          bottom: 15%;
          font-size: 11px; 
          text-align: center;
          margin-top: 20px;
          color: #ffffff;
      }

      .attribution a { 
        color: #3e52a3; 
      }
    </style>
  </head>

  <body>
    <div class="bg-top">
      <img src="./images/bg-pattern-top.svg" />
    </div>
    
    <div class="container">
      <div class="card">
        <div class="card-header">
          <img src="./images/bg-pattern-card.svg" alt="Background Pattern" class="background">
          <img src="./images/image-victor.jpg" alt="Profile Picture" class="profile-picture">
        </div>
        <div class="card-body">
          <h1>Victor Crest <span>26</span></h1>
          <p>London</p>
        </div>
        <div class="card-footer">
          <ul>
            <li>80K
              <span>Followers</span>
            </li>
            <li>
              803K<span>Likes</span>
            </li>
            <li>1.4K
              <span>Photos</span>
            </li>
          </ul>
        </div>
      </div>
    </div>
    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">Muhammad Shehu</a>.
    </div>

    <div class="bg-bottom">
      <img src="./images/bg-pattern-bottom.svg" />
    </div>

  </body>
</html>
